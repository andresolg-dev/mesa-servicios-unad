<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#1652D4"/>
  <!-- Horizontal bar of T -->
  <line x1="38" y1="68" x2="142" y2="68" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Vertical stem of T -->
  <line x1="90" y1="68" x2="90" y2="136" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="38" cy="68" r="10" fill="#FFB800"/>
  <circle cx="142" cy="68" r="10" fill="white" fill-opacity="0.85"/>
  <circle cx="90" cy="136" r="10" fill="white" fill-opacity="0.6"/>
  <!-- Small connector dot at T junction -->
  <circle cx="90" cy="68" r="6" fill="#1652D4"/>
</svg>
